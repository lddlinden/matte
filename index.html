<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matteläxa för Mila</title>
    <link rel="stylesheet" href="https://pyscript.net/latest/core.css" />
    <script defer src="https://pyscript.net/latest/core.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4fa; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px #0001; padding: 32px 24px; }
        h1 { text-align: center; color: #4a3fa5; }
        .uppgift { font-size: 2em; text-align: center; margin: 24px 0 16px 0; }
        .feedback { text-align: center; margin: 12px 0; font-size: 1.1em; }
        .feedback.ratt { color: #1b7e2c; }
        .feedback.fel { color: #b30000; }
        .feedback.tips { color: #b38f00; }
        .stat { margin-top: 24px; background: #f7f7fa; border-radius: 10px; padding: 12px; font-size: 1em; }
        .input-row { display: flex; gap: 8px; justify-content: center; }
        input[type=number] { font-size: 1.2em; padding: 8px; border-radius: 8px; border: 1px solid #aaa; width: 80px; text-align: center; }
        button { font-size: 1.1em; padding: 8px 18px; border-radius: 8px; border: none; background: #4a3fa5; color: #fff; cursor: pointer; }
        button:disabled { background: #aaa; }
        @media (max-width: 500px) { .container { padding: 12px 2vw; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🧮 Matteläxa<br><span style="font-size:0.6em; color:#888">för Mila</span></h1>
    <div id="uppgift" class="uppgift"></div>
    <div class="input-row">
        <input type="number" id="svar" placeholder="Ditt svar" autocomplete="off" />
        <button id="skicka">Skicka</button>
    </div>
    <div id="feedback" class="feedback"></div>
    <button id="next" style="display:none; width:100%; margin-top:10px;">Nästa uppgift →</button>
    <div class="stat" id="stat"></div>
<script>
const ratt_svar_lista = ["Snyggt jobbat!", "Bra", "Utmärkt!", "Perfekt!", "Bra gjort!", "Du är bäst!", "Imponerande!"];
const tips_lista = [
    "Tänk på att du kan ta bort lika mycket från varje sida",
    "Räkna på fingrarna eller använd papper",
    "Börja med det större talet och räkna upp/ned",
    "Dela upp talet i mindre delar",
    "Försök igen - du klarar det!"
];
let totala_uppgifter = 0;
let ratt_pa_forsta = 0;
let uppgift = {};

function nyUppgift() {
    uppgift.forsok = 0;
    uppgift.ratt = false;
    const op = Math.random() < 0.5 ? '+' : '-';
    const t1 = Math.floor(Math.random() * 20) + 1;
    let t2, svar;
    if (op === '+') {
        t2 = Math.floor(Math.random() * 10) + 1;
        svar = t1 + t2;
    } else {
        t2 = Math.floor(Math.random() * t1) + 1;
        svar = t1 - t2;
    }
    uppgift.text = `${t1} ${op} ${t2}`;
    uppgift.svar = svar;
    visaUppgift();
}

function visaUppgift() {
    document.getElementById("uppgift").innerText = uppgift.text;
    document.getElementById("svar").value = "";
    document.getElementById("svar").disabled = false;
    document.getElementById("skicka").disabled = false;
    document.getElementById("feedback").innerText = "";
    document.getElementById("feedback").className = "feedback";
    document.getElementById("next").style.display = "none";
    document.getElementById("svar").focus();
    uppdateraStat();
}

function uppdateraStat() {
    let stat = totala_uppgifter ?
        `Uppgifter gjorda: ${totala_uppgifter} | Rätt på första: ${ratt_pa_forsta} | Träffsäkerhet: ${Math.round(ratt_pa_forsta / totala_uppgifter * 100)}%`
        : "Uppgifter gjorda: 0";
    document.getElementById("stat").innerText = stat;
}

function skickaSvar() {
    if (uppgift.ratt) return;
    const svar = document.getElementById("svar").value.trim();
    const feedback = document.getElementById("feedback");
    if (!svar || isNaN(svar)) {
        feedback.innerText = "Skriv ett tal!";
        feedback.className = "feedback fel";
        return;
    }
    if (Number(svar) === uppgift.svar) {
        feedback.innerText = ratt_svar_lista[Math.floor(Math.random()*ratt_svar_lista.length)];
        feedback.className = "feedback ratt";
        uppgift.ratt = true;
        if (uppgift.forsok === 0) ratt_pa_forsta++;
        document.getElementById("next").style.display = "block";
        document.getElementById("svar").disabled = true;
        document.getElementById("skicka").disabled = true;
        totala_uppgifter++;
        uppdateraStat();
    } else {
        uppgift.forsok++;
        if (uppgift.forsok === 1) {
            feedback.innerText = "Försök igen! " + tips_lista[Math.floor(Math.random()*tips_lista.length)];
            feedback.className = "feedback fel";
        } else if (uppgift.forsok === 2) {
            feedback.innerText = "Tips: " + tips_lista[Math.floor(Math.random()*tips_lista.length)];
            feedback.className = "feedback tips";
        } else if (uppgift.forsok === 3) {
            feedback.innerText = `Rätt svar var ${uppgift.svar}`;
            feedback.className = "feedback fel";
            uppgift.ratt = true;
            document.getElementById("next").style.display = "block";
            document.getElementById("svar").disabled = true;
            document.getElementById("skicka").disabled = true;
            totala_uppgifter++;
            uppdateraStat();
        } else {
            feedback.innerText = "För många försök. Gå vidare!";
            feedback.className = "feedback fel";
            document.getElementById("next").style.display = "block";
            document.getElementById("svar").disabled = true;
            document.getElementById("skicka").disabled = true;
            totala_uppgifter++;
            uppdateraStat();
        }
    }
}

function nastaUppgift() {
    nyUppgift();
}

document.getElementById("skicka").addEventListener("click", skickaSvar);
document.getElementById("next").addEventListener("click", nastaUppgift);
document.getElementById("svar").addEventListener("keypress", function(e) {
    if (e.key === "Enter") skickaSvar();
});

nyUppgift();
</script>
</body>
</html>
